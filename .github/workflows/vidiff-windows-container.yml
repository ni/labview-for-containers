name: VIDiff Report - Windows Container

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '**/*.vi'

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      vi_matrix: ${{ steps.changed-vis.outputs.vi_matrix }}
      vi_files: ${{ steps.changed-vis.outputs.vi_files }}
      has_changes: ${{ steps.changed-vis.outputs.has_changes }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect changed VI files
        id: changed-vis
        run: |
          CHANGED_VIS=$(git diff --name-only --diff-filter=ACMR ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- '*.vi' || true)
          if [ -z "$CHANGED_VIS" ]; then
            echo "No .vi files changed."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo 'vi_matrix=[]' >> "$GITHUB_OUTPUT"
          else
            echo "Changed VI files:"
            echo "$CHANGED_VIS"
            JSON_ARRAY=$(echo "$CHANGED_VIS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "vi_matrix=${JSON_ARRAY}" >> "$GITHUB_OUTPUT"
            echo "vi_files=$(echo $CHANGED_VIS | tr '\n' ',')" >> "$GITHUB_OUTPUT"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  vidiff:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        vi: ${{ fromJson(needs.detect-changes.outputs.vi_matrix) }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Pull LabVIEW container image
        run: docker pull nationalinstruments/labview:latest-windows

      - name: Run VIDiff for ${{ matrix.vi }}
        shell: pwsh
        run: |
          docker run --rm `
            -v "${{ github.workspace }}\pr:C:\workspace" `
            -v "${{ github.workspace }}\base:C:\workspace-base" `
            nationalinstruments/labview:latest-windows `
            powershell -File "C:\workspace\examples\cicd-examples\helper-scripts\vidiff\vidiff.ps1" -WorkspaceRoot "C:\workspace" -WorkspaceBaseRoot "C:\workspace-base" -VIFiles "${{ matrix.vi }}"

      - name: Upload VIDiff report
        uses: actions/upload-artifact@v4
        with:
          name: vidiff-report-windows-${{ strategy.job-index }}
          path: ${{ github.workspace }}\pr\vidiff-reports\

  upload-metadata:
    needs: [detect-changes, vidiff]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Save metadata
        run: |
          mkdir -p metadata
          echo "${{ github.event.pull_request.number }}" > metadata/pr_number
          echo "windows" > metadata/platform
          echo "${{ needs.detect-changes.outputs.vi_files }}" > metadata/vi_files

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: vidiff-metadata-windows
          path: metadata/
